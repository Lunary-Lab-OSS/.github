name: Feature request
description: Suggest an improvement and explain the use case.
title: "[feat] "
labels: [enhancement]
body:
  - type: dropdown
    id: repository
    attributes:
      label: Repository
      description: Choose the repository where the improvement belongs.
      options:
        - signal-asr-strategies
        - signal-local-llm
      default: 0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the limitation without including private data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change, and what should stay the same?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
