name: Bug report
description: Report a reproducible problem with documented behaviour.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, read the affected repository's Security policy.
        Do not include security-sensitive details, secrets, or personal content here.
  - type: input
    id: version
    attributes:
      label: Repository and version
      description: Name the affected repository and exact version or commit.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal example and relevant configuration, with secrets removed.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, backend, dependency profile, and CPU or GPU.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, prompts, transcripts, and other private data.
      render: text